<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Contacto</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-slate-100 dark:bg-slate-950">

  <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-xl shadow-lg p-6">
    
    <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">
      Contactar a Carlos Daniel Quispe
    </h2>
    <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">
      Envía un mensaje directo para iniciar un proyecto y contactarlo a través del formulario.
    </p>

    <form class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
          Nombre Completo
        </label>
        <input 
          type="text" 
          placeholder="Tu nombre" 
          class="w-full p-3 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-600"
        >
      </div>
      <form class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
          Apellido Completo
        </label>
        <input 
          type="text" 
          placeholder="Tu apellido" 
          class="w-full p-3 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-600"
        >
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
          Correo Electrónico
        </label>
        <input 
          type="email" 
          placeholder="tu@email.com" 
          class="w-full p-3 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-600"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
          Mensaje
        </label>
        <textarea 
          rows="4" 
          placeholder="Escribe tu mensaje aquí..." 
          class="w-full p-3 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-600"
        ></textarea>
      </div>

      <button 
        type="submit" 
        class="w-full bg-green-700 hover:bg-green-800 text-white font-semibold py-3 rounded-lg transition"
      >
        Enviar Mensaje
      </button>
    </form>

    <a 
      href="index.html" 
      class="block text-center text-sm text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white mt-4 transition"
    >
      ← Volver al Perfil
    </a>

  </div>

</body>
</html>
